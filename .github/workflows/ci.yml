name: CI
 
on:
  push:
  pull_request:
 
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Install uv
        uses: astral-sh/setup-uv@v3
 
      - name: Install dependencies
        run: uv sync --locked
 
      - name: Lint
        run: uv run ruff check .
 
      - name: Smoke test — does the code at least import cleanly?
        run: uv run python -c "import harness"