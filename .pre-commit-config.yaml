repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks   # blocks commits that contain API keys/secrets
 
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks   # blocks commits that contain API keys/secrets
 
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (project-pinned)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format (project-pinned)
        entry: uv run ruff format
        language: system
        types: [python]
 