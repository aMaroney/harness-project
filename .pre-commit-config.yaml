repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks   # blocks commits that contain API keys/secrets
 
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff        # lint, auto-fixing what it safely can
        args: [--fix]
      - id: ruff-format # auto-formats (spacing, quotes, line length)